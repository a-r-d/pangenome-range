[workspace]
members = [
    "crates/pangenome-range-build",
    "crates/pangenome-range-cli",
    "crates/pangenome-range-format",
    "crates/pangenome-range-query",
]
default-members = ["crates/pangenome-range-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/a-r-d/pangenome-range"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8.2"
gbz = "0.7.0"
gbz-base = "0.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
simple-sds = "0.4.2"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
