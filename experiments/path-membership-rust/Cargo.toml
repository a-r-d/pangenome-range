[package]
name = "path-membership-rust"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
unpublished-fork-locate = []

[dependencies]
blake3 = "1.8.2"
gbz = "0.7.0"
pangenome-range-format = { path = "../../crates/pangenome-range-format" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
simple-sds = "0.4.2"
zstd = "0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
