[package]
name = "pangenome-range-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Encode, inspect, verify, and benchmark range-addressable pangenome archives"
readme = "README.md"
keywords = ["pangenome", "genomics", "bioinformatics", "gbz", "cli"]
categories = ["command-line-utilities", "science"]
include = ["src/**", "tests/**", "README.md"]
default-run = "pangenome-range"

[dependencies]
gbz.workspace = true
gbz-base.workspace = true
pangenome-range-build = { version = "0.1.0", path = "../pangenome-range-build" }
pangenome-range-format = { version = "0.1.0", path = "../pangenome-range-format" }
pangenome-range-query = { version = "0.1.0", path = "../pangenome-range-query" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
simple-sds.workspace = true

[features]
remote-sqlite-benchmark = ["pangenome-range-build/remote-sqlite-benchmark"]

[lints]
workspace = true

[[bin]]
name = "pangenome-range"
path = "src/main.rs"
