name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:rust
      - run: pnpm package:cargo
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @pangenome-range/benchmark exec playwright install --with-deps chromium
      - name: Smoke-test the built Pages artifact
        run: pnpm --filter @pangenome-range/docs test:pages
      - run: pnpm test:browser:ci
