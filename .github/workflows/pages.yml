name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PANGENOME_RANGE_DEMO_ARCHIVE_URL: ${{ vars.PANGENOME_RANGE_DEMO_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install Rust toolchain for fixture provenance
        run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
      - name: Reuse the checksum-verified Rust conformance fixture
        run: pnpm docs:fixtures
      - name: Build the public npm library exports and VitePress site
        run: pnpm docs:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test the built Pages site
        run: pnpm --filter @pangenome-range/docs test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
