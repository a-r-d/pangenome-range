name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PANGENOME_RANGE_DEMO_ARCHIVE_URL: ${{ vars.PANGENOME_RANGE_DEMO_ARCHIVE_URL || 'https://archives.ard.ninja/pangenome-range/sha256/ecf5ae4fa8c784a80307507f58bed894311b8560724b57de0fcc35237c324b63/hprc-v1-gencode-v50-disk-t8.pngr' }}
      VITE_PANGENOME_RANGE_DEMO_1000G_ARCHIVE_URL: ${{ vars.PANGENOME_RANGE_DEMO_1000G_ARCHIVE_URL || 'https://archives.ard.ninja/pangenome-range/sha256/71730fab7aad0dbbef81cf7c74b4fa8dbacbb3aad5bab0a797349120b18f6afb/1000gplons-hs38d1-na19239-h0-v1-t8-zstd3.pngr' }}
      VITE_PANGENOME_RANGE_DEMO_RICE_ARCHIVE_URL: ${{ vars.PANGENOME_RANGE_DEMO_RICE_ARCHIVE_URL || 'https://archives.ard.ninja/pangenome-range/sha256/c91768e6e98d32ff6467732a26e32def5058f4c15d247a0ac6a252a4403e134c/rice-chr06-mc-xa7-anonymous.pngr' }}
      VITE_PANGENOME_RANGE_DEMO_CHICKEN_ARCHIVE_URL: ${{ vars.PANGENOME_RANGE_DEMO_CHICKEN_ARCHIVE_URL || 'https://archives.ard.ninja/pangenome-range/sha256/93bcd713ccda14bf4e650c1c8d56751e5ed5db7624aecbf76769fa1909d25e4e/chicken-whole-named.pngr' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install Rust toolchain for fixture provenance
        run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
      - name: Reuse the checksum-verified Rust conformance fixture
        run: pnpm docs:fixtures
      - name: Build the public npm library exports and VitePress site
        run: pnpm docs:build
      - name: Install browser matrix
        run: pnpm --filter @pangenome-range/docs exec playwright install --with-deps chromium firefox webkit
      - name: Smoke-test the built Pages site
        run: pnpm --filter @pangenome-range/docs test:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
